name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      # Every dependency pinned by hash; the package itself without its dependencies.
      run: |
        pip install --require-hashes -r .github/requirements/dev.txt
        pip install --no-deps -e .

    - name: Lint with ruff
      run: |
        ruff check src/ndt tests examples

    - name: Check formatting with ruff
      run: |
        ruff format --check src/ndt tests examples

    - name: Type check with mypy
      run: |
        mypy src/ndt --ignore-missing-imports
      continue-on-error: true  # Don't fail on type errors initially

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=ndt --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
        fail_ci_if_error: false

  lint-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Install dependencies
      # Every dependency pinned by hash; the package itself without its dependencies.
      run: |
        pip install --require-hashes -r .github/requirements/dev.txt
        pip install --no-deps -e .

    - name: Lint with ruff
      run: |
        ruff check src/ndt tests examples

    - name: Check formatting with ruff
      run: |
        ruff format --check src/ndt tests examples
