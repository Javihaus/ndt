name: Fuzz

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/ndt/core/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estimators:
    name: Fuzz the estimators (Atheris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Every dependency pinned by hash; the package itself without its dependencies.
      - name: Install dependencies
        run: |
          pip install --require-hashes -r .github/requirements/fuzz.txt
          pip install --no-deps -e .

      - name: Fuzz for two minutes
        run: python fuzz/fuzz_estimators.py -max_total_time=120 -rss_limit_mb=4096
